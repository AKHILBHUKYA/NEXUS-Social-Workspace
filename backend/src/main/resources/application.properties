spring.application.name=nexus-social-workspace
server.port=${PORT:8080}

# Database - PostgreSQL for production, H2 for local/tests if no DB_URL
spring.datasource.url=${DB_URL:jdbc:h2:mem:nexus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:NEXUS-ChangeMe-To-A-Long-Random-Secret-Key-At-Least-256-Bits-Long-For-Production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AI (OpenAI-compatible / Groq)
ai.provider=${AI_PROVIDER:groq}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:llama-3.3-70b-versatile}

# Media / Storage (optional Supabase or local)
app.media.base-url=${MEDIA_BASE_URL:}
app.media.max-size-mb=${MEDIA_MAX_SIZE_MB:10}

# Rate limiting (requests per minute)
app.rate-limit.login=10
app.rate-limit.ai=20
app.rate-limit.write=60

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Multipart uploads
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB
app.media.storage-path=${MEDIA_STORAGE_PATH:./uploads}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}


# Official social API integrations. Set these in Render/Vercel environment variables.
app.backend-url=${BACKEND_URL:http://localhost:8080}
social.redirect-path=${SOCIAL_REDIRECT_PATH:/api/social/callback}
social.meta.client-id=${SOCIAL_META_CLIENT_ID:}
social.meta.client-secret=${SOCIAL_META_CLIENT_SECRET:}
social.meta.graph-version=${SOCIAL_META_GRAPH_VERSION:v23.0}
social.x.client-id=${SOCIAL_X_CLIENT_ID:}
social.x.client-secret=${SOCIAL_X_CLIENT_SECRET:}
social.x.scopes=${SOCIAL_X_SCOPES:tweet.read tweet.write users.read offline.access}

social.whatsapp.phone-number-id=${SOCIAL_WHATSAPP_PHONE_NUMBER_ID:}

# Webhooks
social.webhook.verify-token=${META_WEBHOOK_VERIFY_TOKEN:nexus-verify}
